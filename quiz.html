
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz xác minh anh trai 🎀</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .quiz-question {
      margin: 24px 0;
      color: #814e67;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
    }

    .quiz-options {
      display: grid;
      gap: 12px;
      margin: 22px 0;
    }

    .quiz-option {
      width: 100%;
      padding: 15px;
      border: 2px solid #f2c6d8;
      border-radius: 16px;
      background: #fff8fb;
      color: #75485e;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .quiz-option:hover:not(:disabled) {
      background: #ffe7f0;
      transform: translateY(-2px);
    }

    .quiz-option.correct {
      border-color: #91c9a5;
      background: #eaf8ee;
      color: #356d49;
    }

    .quiz-option.wrong {
      border-color: #e8a0aa;
      background: #fff0f1;
      color: #a33f55;
    }

    .quiz-option:disabled {
      cursor: default;
    }

    .quiz-feedback {
      min-height: 28px;
      margin: 14px 0;
      font-weight: 600;
      color: #a34e75;
    }

    .next-button {
      display: none;
      text-decoration: none;
      margin-top: 12px;
    }

    .next-button.visible {
      display: inline-block;
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <section class="lock-card">

      <div class="success-mark">📝</div>

      <p class="eyebrow">BROTHER VERIFICATION · 01</p>

      <h1>Bài kiểm tra danh tính</h1>

      <p class="intro">
        Trả lời cho cẩn thận nhé. Đừng để anh trai mình bị người khác giả mạo! (⁠ಠ⁠_⁠ಠ⁠)
      </p>

      <p class="quiz-question">
        Anh trai tôi sinh ngày tháng năm nào?
      </p>

      <div class="quiz-options">
        <button class="quiz-option" data-answer="A">
          A. Ngày 61/10/2004
        </button>

        <button class="quiz-option" data-answer="B">
          B. Ngày 16/01/4002
        </button>

        <button class="quiz-option" data-answer="C">
          C. Ngày 16/10/2004
        </button>

        <button class="quiz-option" data-answer="D">
          D. Tất cả các đáp án trên
        </button>
      </div>

      <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>

      <a href="quiz2.html"
         id="next-button"
         class="button button-primary next-button">
        Tiếp theo 💗
      </a>

    </section>
  </main>

  <script>
    const options = document.querySelectorAll(".quiz-option");
    const feedback = document.querySelector("#quiz-feedback");
    const nextButton = document.querySelector("#next-button");

    options.forEach((option) => {
      option.addEventListener("click", () => {
        if (option.disabled) return;

        const answer = option.dataset.answer;

        if (answer === "C") {
          option.classList.add("correct");
          feedback.textContent = "Chính xác! Qua được vòng 1 rồi! 🎉";
          nextButton.classList.add("visible");

          options.forEach((item) => {
            item.disabled = true;
          });
        } else {
          option.classList.add("wrong");
          feedback.textContent =
            "Sai rồi nhé! Thử lại đi, kẻ đáng nghi (⁠ಠ⁠_⁠ಠ⁠)";
        }
      });
    });
  </script>
</body>
</html>
