
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz - Câu hỏi 3 🎀</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .quiz-question {
      margin: 24px 0;
      color: #814e67;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.7;
    }

    .answer-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-height: 180px;
      margin-top: 28px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255, 240, 247, 0.5);
    }

    .answer-option {
      max-width: 100%;
      padding: 15px 20px;
      border: 2px solid #f2c6d8;
      border-radius: 16px;
      background: #fff8fb;
      color: #75485e;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition:
        left 0.25s ease,
        top 0.25s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .answer-option:hover {
      background: #ffe5ef;
    }

    .yes-option {
      background: #ffe5f0;
      border-color: #e8a0bf;
    }

    .yes-option:hover {
      background: #ffd6e8;
    }

    .no-option {
      position: relative;
      z-index: 2;
    }

    .quiz-feedback {
      min-height: 28px;
      margin-top: 20px;
      color: #a34e75;
      font-weight: 600;
      text-align: center;
    }

    .next-link {
      display: none;
      margin-top: 16px;
      color: #d66b98;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: underline;
    }

    .next-link.visible {
      display: inline-block;
    }

    .hidden-option {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      .answer-option {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <section class="lock-card">

      <div class="success-mark">🐴</div>

      <p class="eyebrow">BROTHER VERIFICATION · 03</p>

      <h1>Câu hỏi số 3</h1>

      <p class="quiz-question">
        Anh sẽ mua cho em một con ngựa chứ?
      </p>

      <div class="answer-area" id="answer-area">

        <button
          type="button"
          class="answer-option yes-option"
          id="yes-option"
        >
          Chắc chắn rồi em gái cute!
        </button>

        <button
          type="button"
          class="answer-option no-option"
          id="no-option"
        >
          M bị điên à
        </button>

      </div>

      <p
        class="quiz-feedback"
        id="quiz-feedback"
        aria-live="polite"
      ></p>

      <a
        href="page1.html"
        class="next-link"
        id="next-link"
      >
        Tiếp theo →
      </a>

    </section>
  </main>


<script>
  const answerArea = document.querySelector("#answer-area");
  const yesOption = document.querySelector("#yes-option");
  const noOption = document.querySelector("#no-option");
  const feedback = document.querySelector("#quiz-feedback");
  const nextLink = document.querySelector("#next-link");

  let noClickCount = 0;

  // Bấm câu trả lời đồng ý
  yesOption.addEventListener("click", () => {
    feedback.textContent =
      "Biết ngay anh là người anh trai tuyệt vời mà! 🐴💗";

    noOption.disabled = true;
    yesOption.disabled = true;

    nextLink.classList.add("visible");
  });

  // Bấm câu trả lời từ chối
  noOption.addEventListener("click", () => {
    noClickCount++;

    // Đến lần bấm thứ 5, nút biến mất
    if (noClickCount >= 5) {
      noOption.classList.add("hidden-option");

      feedback.textContent =
        "(⁠｡⁠•̀⁠ᴗ⁠-⁠)⁠✧";

      return;
    }

    // Di chuyển nút mà không tiết lộ số lần đã bấm
    const areaRect = answerArea.getBoundingClientRect();
    const buttonRect = noOption.getBoundingClientRect();

    const maxX = Math.max(
      0,
      areaRect.width - buttonRect.width - 16
    );

    const maxY = Math.max(
      0,
      areaRect.height - buttonRect.height - 16
    );

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noOption.style.position = "absolute";
    noOption.style.left = randomX + "px";
    noOption.style.top = randomY + "px";

    // Không hiển thị số lần bấm
    feedback.textContent = "";
  });
</script>
