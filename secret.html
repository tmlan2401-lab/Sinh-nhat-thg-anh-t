
<!DOCTYPE html>
<html lang="vi">
<head>

  <title>Hihi khen vậy em thíc lắm đó 🎂</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-shell">
    <section class="lock-card secret-card">

      <div class="success-mark">🎉</div>

      <p class="eyebrow">PASSWORD UNLOCKED</p>

      <h1>Chúc mừng tìm được password! 🎂</h1>

      <p class="intro">
        Bạn đã vượt qua vòng đầu tiên...
      </p>

      <div class="secret-message">
        <span class="message-sparkle">🧁</span>

        <p>
          Nhưng làm sao mà tôi biết liệu
          bạn có phải thg anh trai tôi không
          hay là một kẻ giả mạo
          <span>(⁠ಠ⁠_⁠ಠ⁠)?!</span>
        </p>

        <span class="message-sparkle">🎀</span>
      </div>

      <p class="closing-line">
         Hãy làm một bài kiểm tra để chứng minh thân phận!
      </p>

      <a href="quiz.html" class="button button-primary">
        Đi đến bài quiz 🐍✨
      </a>

    </section>
  </main>

  <script src="secret.js"></script>

</html>
