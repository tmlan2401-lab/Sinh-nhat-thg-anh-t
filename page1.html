
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY BIRTHDAY 🎂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #f9dce8, #fce9f1);
      color: #75445a;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      width: min(92%, 650px);
      margin: 0 auto;
      padding: 45px 0 35px;
    }

    /* MÀN HÌNH XÁC MINH */

    #verify-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #fff0f5, #f5c9dc);
      cursor: pointer;
      transition: opacity 0.7s ease;
    }

    #verify-screen h1 {
      font-size: clamp(24px, 6vw, 38px);
      margin-bottom: 12px;
    }

    #verify-screen p {
      font-size: 16px;
      animation: blink 1.5s infinite;
    }

    #verify-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* NỘI DUNG SINH NHẬT */

    #birthday-content {
      display: none;
    }

    #birthday-content.show {
      display: block;
      animation: appear 1s ease;
    }

    h1 {
      font-size: clamp(30px, 8vw, 46px);
      color: #d45b8b;
      margin: 10px 0;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 16px;
      margin: 12px 0 28px;
      line-height: 1.7;
    }

    /* Ô VIẾT ĐIỀU ƯỚC */

    .wish-label {
      display: block;
      font-size: 16px;
      line-height: 1.8;
      margin: 24px 0 14px;
    }

    .wish-form {
      display: flex;
      gap: 8px;
      width: 100%;
      margin: 0 auto;
    }

    #wish-input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 2px solid #edb2ca;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      background: #fffafd;
      color: #75445a;
    }

    #wish-input:focus {
      border-color: #d45b8b;
      box-shadow: 0 0 8px #edb2ca;
    }

    #enter-button {
      padding: 12px 17px;
      border: none;
      border-radius: 12px;
      background: #d45b8b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #enter-button:hover {
      background: #b84473;
      transform: translateY(-2px);
    }

    #wish-feedback {
      min-height: 25px;
      margin-top: 12px;
      font-size: 14px;
      color: #a84b76;
      line-height: 1.6;
    }

    /* BÁNH SINH NHẬT */

    #cake-section {
      display: none;
      margin-top: 12px;
    }

    #cake-section.show {
      display: block;
      animation: appear 1s ease;
    }

    .cake-scene {
      position: relative;
      width: 280px;
      height: 270px;
      max-width: 100%;
      margin: 0 auto;
      animation: float 3s ease-in-out infinite;
    }

    /* ĐĨA BÁNH */

    .plate {
      position: absolute;
      bottom: 25px;
      left: 10px;
      width: 260px;
      height: 18px;
      background: #e7a9c2;
      border-radius: 50%;
      box-shadow: 0 7px 0 #d58cab;
    }

    /* TẦNG BÁNH DƯỚI */

    .cake-bottom {
      position: absolute;
      bottom: 43px;
      left: 35px;
      width: 210px;
      height: 80px;
      background: #f4a6c5;
      border: 3px solid #d982a7;
      border-radius: 12px 12px 18px 18px;
      overflow: hidden;
    }

    .cake-bottom::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 18px;
      background: #fff0f5;
      border-radius: 8px 8px 50% 50%;
    }

    .cake-bottom::after {
      content: "♥  ♥  ♥  ♥";
      position: absolute;
      bottom: 13px;
      left: 12px;
      width: 100%;
      color: #fff5fa;
      font-size: 17px;
      letter-spacing: 7px;
    }

    /* TẦNG BÁNH TRÊN */

    .cake-top {
      position: absolute;
      bottom: 123px;
      left: 57px;
      width: 166px;
      height: 48px;
      background: #ffe2ed;
      border: 3px solid #e8a1bf;
      border-radius: 12px 12px 8px 8px;
    }

    .cake-top::before {
      content: "";
      position: absolute;
      top: -3px;
      left: -3px;
      width: 166px;
      height: 16px;
      background: #fff7fa;
      border: 2px solid #e8a1bf;
      border-radius: 10px 10px 50% 50%;
    }

    /* BA NGỌN NẾN */

    .candles {
      position: absolute;
      bottom: 171px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    .candle {
      position: relative;
      width: 12px;
      height: 42px;
      border-radius: 4px 4px 2px 2px;
      background: repeating-linear-gradient(
        135deg,
        #fff8fb 0px,
        #fff8fb 5px,
        #e78ab0 5px,
        #e78ab0 10px
      );
      cursor: pointer;
    }

    .candle:focus-visible {
      outline: 2px solid #b84473;
      outline-offset: 5px;
    }

    .flame {
      position: absolute;
      top: -25px;
      left: 1px;
      width: 10px;
      height: 19px;
      background: #ffb52e;
      border-radius: 50% 50% 45% 45%;
      box-shadow: 0 0 12px #ffbf47;
      animation: flicker 0.6s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }

    .flame::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 3px;
      width: 4px;
      height: 9px;
      background: #fff5b5;
      border-radius: 50%;
    }

    .flame.off {
      display: none;
    }

    .cake-instruction {
      margin-top: 8px;
      color: #d45b8b;
      font-size: 23px;
      font-weight: bold;
      animation: blink 1.2s infinite;
    }

    .small-note {
      font-size: 13px;
      color: #a86d87;
      margin-top: 10px;
      line-height: 1.6;
    }

    /* NÚT TIẾP THEO */

    .next-page {
      display: none;
      width: fit-content;
      margin: 22px auto 0;
      padding: 10px 24px;
      color: #d45b8b;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      border: 2px solid #edb2ca;
      border-radius: 14px;
      transition: background 0.25s, color 0.25s,
                  transform 0.25s;
    }

    .next-page.visible {
      display: block;
      animation: appear 0.7s ease;
    }

    .next-page:hover {
      background: #d45b8b;
      color: white;
      transform: translateY(-3px);
    }

    .next-page:focus-visible {
      outline: 3px solid #b84473;
      outline-offset: 4px;
    }

    /* HIỆU ỨNG */

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    @keyframes flicker {
      from {
        transform: rotate(-5deg) scale(1);
      }

      to {
        transform: rotate(5deg) scale(1.12, 0.92);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }
    }

    /* ĐIỆN THOẠI */

    @media (max-width: 400px) {
      .container {
        padding-top: 30px;
      }

      .wish-form {
        flex-direction: column;
      }

      #enter-button {
        width: 100%;
      }

      .cake-scene {
        transform-origin: top center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- MÀN HÌNH XÁC MINH -->

  <div id="verify-screen" role="button" tabindex="0"
       aria-label="Chạm để tiếp tục">
    <h1>✓ Xác minh danh tính thành công</h1>
    <p>Chạm vào màn hình để tiếp tục ♡</p>
  </div>

  <main class="container">

    <!-- NỘI DUNG SINH NHẬT -->

    <section id="birthday-content">

      <h1>Chúc mừng sinh nhật lần thứ 22 của anh Khoa!</h1>
      

      <!-- NHẬP ĐIỀU ƯỚC -->

      <label class="wish-label" for="wish-input">
        Hãy viết điều ước của anh khi bước sang tuổi mới
        <br>
        (⁠ﾉ⁠◕⁠ヮ⁠◕⁠)⁠ﾉ⁠*⁠.⁠✧
        <br>
        (yên tâm e k đọc được đâu🥀)
      </label>

      <form class="wish-form" id="wish-form">
        <input
          id="wish-input"
          name="wish"
          type="text"
          placeholder="Viết điều ước ở đây..."
          autocomplete="off"
          maxlength="500"
          required
        >

        <button id="enter-button" type="submit">
          Enter
        </button>
      </form>

      <p id="wish-feedback" aria-live="polite"></p>

      <!-- BÁNH SINH NHẬT -->

      <section id="cake-section">

        <div class="cake-scene"
             role="group"
             aria-label="Bánh sinh nhật có ba ngọn nến">

          <div class="plate"></div>
          <div class="cake-bottom"></div>
          <div class="cake-top"></div>

          <div class="candles">

            <div class="candle" role="button" tabindex="0"
                 aria-label="Tắt nến thứ nhất">
              <div class="flame"></div>
            </div>

            <div class="candle" role="button" tabindex="0"
                 aria-label="Tắt nến thứ hai">
              <div class="flame"></div>
            </div>

            <div class="candle" role="button" tabindex="0"
                 aria-label="Tắt nến thứ ba">
              <div class="flame"></div>
            </div>

          </div>
        </div>

        <p class="cake-instruction">thổi nến đi (⁠ㆁ⁠ω⁠ㆁ⁠)!!</p>

        <p class="small-note">
          Bấm vào từng ngọn nến để thổi tắt.
        </p>

        <!-- Chỉ hiện sau khi cả ba ngọn nến tắt -->

        <a href="page2.html" id="next-page" class="next-page">
          Tiếp theo →
        </a>

      </section>

    </section>

  </main>

  <script>
    // 1. XỬ LÝ MÀN HÌNH XÁC MINH

    const verifyScreen = document.getElementById("verify-screen");
    const birthdayContent = document.getElementById("birthday-content");

    let hasEntered = false;

    function enterBirthdayPage() {
      if (hasEntered) return;

      hasEntered = true;

      verifyScreen.classList.add("hidden");
      birthdayContent.classList.add("show");

      // Cho phép màn hình xác minh biến mất hoàn toàn
      setTimeout(() => {
        verifyScreen.style.display = "none";
      }, 700);
    }

    verifyScreen.addEventListener("click", enterBirthdayPage);

    verifyScreen.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        enterBirthdayPage();
      }
    });


    // 2. XỬ LÝ Ô ĐIỀU ƯỚC VÀ NÚT ENTER

    const wishForm = document.getElementById("wish-form");
    const wishInput = document.getElementById("wish-input");
    const wishFeedback = document.getElementById("wish-feedback");
    const cakeSection = document.getElementById("cake-section");

    wishForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const wish = wishInput.value.trim();

      if (!wish) {
        wishFeedback.textContent = "Viết điều ước trước đã nha!";
        wishInput.focus();
        return;
      }

      wishFeedback.textContent =
        "Điều ước đã được gửi đến vũ trụ ♡";

      cakeSection.classList.add("show");

      // Cuộn xuống bánh nếu màn hình nhỏ
      setTimeout(() => {
        cakeSection.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }, 100);
    });


    // 3. XỬ LÝ BA NGỌN NẾN

    const candles = document.querySelectorAll(".candle");
    const nextPage = document.getElementById("next-page");

    function blowOutCandle(candle) {
      const flame = candle.querySelector(".flame");

      // Nếu nến đã tắt thì không làm gì nữa
      if (flame.classList.contains("off")) {
        return;
      }

      flame.classList.add("off");

      // Kiểm tra xem tất cả nến đã tắt chưa
      const allCandlesOut = [...candles].every((item) => {
        return item.querySelector(".flame").classList.contains("off");
      });

      // Chỉ hiện nút khi cả ba ngọn nến đều tắt
      if (allCandlesOut) {
        nextPage.classList.add("visible");
        nextPage.setAttribute("aria-hidden", "false");

        wishFeedback.textContent =
          "Chúc mừng sinh nhật! Hoàn thành nhiệm vụ thổi nến rồi ♡";

        nextPage.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }
    }

    candles.forEach((candle) => {
      candle.addEventListener("click", () => {
        blowOutCandle(candle);
      });

      candle.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          blowOutCandle(candle);
        }
      });
    });
  </script>

</body>
</html>
