
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0911">
  <title>Mật mã bí mật</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="lock-card" aria-labelledby="page-title">
      <div class="orb orb-one" aria-hidden="true"></div>
      <div class="orb orb-two" aria-hidden="true"></div>

      <div class="lock-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M20 27v-8a12 12 0 0 1 24 0v8" />
          <rect x="13" y="27" width="38" height="29" rx="7" />
          <circle cx="32" cy="40" r="3" />
          <path d="M32 43v5" />
        </svg>
      </div>

      <p class="eyebrow">A LITTLE SECRET</p>
      <h1 id="page-title">Em biết mật mã chứ?</h1>
      <p class="intro">
        Nhập mật khẩu để mở cánh cửa bí mật này.
      </p>

      <form id="password-form" novalidate>
        <label class="visually-hidden" for="password-input">
          Mật khẩu
        </label>

        <input
          id="password-input"
          name="password"
          type="password"
          placeholder="Nhập mật khẩu..."
          autocomplete="off"
          spellcheck="false"
          aria-describedby="feedback"
          required
        >

        <div class="actions">
          <button class="button button-primary" type="submit">
            Mở khóa <span aria-hidden="true">↗</span>
          </button>

          <button
            class="button button-secondary"
            id="hint-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="hint-box"
          >
            Gợi ý <span aria-hidden="true">✦</span>
          </button>
        </div>
      </form>

      <div class="hint-box" id="hint-box" hidden>
        <p class="hint-label">GỢI Ý NHỎ</p>
        <p>
          Cú pháp: vai trò của người gửi đối với bạn
          + cute bá khí nhất thế giới
        </p>
      </div>

      <p class="feedback" id="feedback"
         role="status" aria-live="polite"></p>

      <p class="tiny-note">
        Chỉ người biết mật mã mới được đi tiếp…
        về mặt giao diện thôi nhé.
      </p>
    </section>
  </main>
</body>
</html>
