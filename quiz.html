<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz - Câu hỏi 1 🎀</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .quiz-question {
      margin: 24px 0;
      color: #814e67;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
    }

    .quiz-options {
      display: grid;
      gap: 12px;
      margin: 24px 0;
    }

    .quiz-option {
      width: 100%;
      padding: 16px;
      border: 2px solid #f2c6d8;
      border-radius: 16px;
      background: #fff8fb;
      color: #75485e;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .quiz-option:hover:not(:disabled) {
      background: #ffe5ef;
      border-color: #e8a0bf;
      transform: translateY(-2px);
    }

    .quiz-option:focus-visible {
      outline: 3px solid #d66b98;
      outline-offset: 3px;
    }

    .quiz-option.correct {
      background: #e8f8ec;
      border-color: #81c995;
      color: #287744;
    }

    .quiz-option.wrong {
      background: #fff0f1;
      border-color: #e7a0aa;
      color: #a33f55;
    }

    .quiz-option:disabled {
      cursor: default;
    }

    .quiz-feedback {
      min-height: 28px;
      margin: 16px 0;
      color: #a34e75;
      font-weight: 600;
      line-height: 1.5;
    }

    .next-link {
      display: none;
      margin-top: 12px;
      color: #d66b98;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .next-link.visible {
      display: inline-block;
    }

    .next-link:hover {
      color: #a94775;
    }

    @media (prefers-reduced-motion: reduce) {
      .quiz-option {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="page-shell">
    <section class="lock-card">

      <div class="success-mark">📝</div>

      <p class="eyebrow">BROTHER VERIFICATION · 01</p>

      <h1>Bài kiểm tra danh tính</h1>

      <p class="quiz-question">
        Anh trai tôi sinh ngày tháng năm nào?
      </p>

      <div class="quiz-options">
        <button type="button" class="quiz-option" data-answer="A">
          A. Ngày 61/10/2004
        </button>

        <button type="button" class="quiz-option" data-answer="B">
          B. Ngày 16/01/4002
        </button>

        <button type="button" class="quiz-option" data-answer="C">
          C. Ngày 16/10/2004
        </button>

        <button type="button" class="quiz-option" data-answer="D">
          D. Tất cả các đáp án trên
        </button>
      </div>

      <p
        id="quiz-feedback"
        class="quiz-feedback"
        aria-live="polite"
      ></p>

      <a
        href="quiz2.html"
        id="next-button"
        class="next-link"
        hidden
      >
        Tiếp theo →
      </a>

    </section>
  </main>

  <script>
    // XỬ LÝ CÂU HỎI QUIZ
    const options = document.querySelectorAll(".quiz-option");
    const feedback = document.querySelector("#quiz-feedback");
    const nextButton = document.querySelector("#next-button");

    options.forEach((option) => {
      option.addEventListener("click", () => {
        if (nextButton.classList.contains("visible")) {
          return;
        }

        options.forEach((item) => {
          item.classList.remove("wrong", "correct");
        });

        const answer = option.dataset.answer;

        if (answer === "C") {
          option.classList.add("correct");

          feedback.textContent = "Chính xác! 🎉";

          nextButton.hidden = false;
          nextButton.classList.add("visible");

          options.forEach((item) => {
            item.disabled = true;
          });
        } else {
          option.classList.add("wrong");

          feedback.textContent = "Sai mẹ r cha (⁠ಠ⁠_⁠ಠ⁠)";
        }
      });
    });
  </script>

</body>
</html>
