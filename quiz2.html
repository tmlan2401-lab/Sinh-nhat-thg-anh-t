
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz - Câu hỏi 2 🎀</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .quiz-question {
      margin: 24px 0;
      color: #814e67;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.7;
    }

    .answer-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 24px 0;
    }

    .answer-option {
      padding: 16px;
      border: 2px solid #f2c6d8;
      border-radius: 16px;
      background: #fff8fb;
      color: #75485e;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .answer-option:hover {
      background: #ffe5ef;
      transform: translateY(-2px);
    }

    .answer-option:focus-visible,
    .next-link:focus-visible {
      outline: 3px solid #d66b98;
      outline-offset: 3px;
    }

    .response-box {
      display: none;
      margin-top: 24px;
      padding: 22px 16px;
      border-radius: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .response-box.visible {
      display: block;
    }

    /* Thông báo khi bấm Có */
    .healthy-response {
      background: #ffe5f0;
      border: 2px solid #f3b8d0;
      color: #34834c;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(220, 130, 170, 0.12);
    }

    /* Cảnh báo đỏ pastel trong suốt */
    .warning-response {
      background: rgba(255, 170, 180, 0.28);
      border: 2px solid rgba(239, 112, 130, 0.65);
      color: #d94f68;
      font-size: 1.2rem;
      font-weight: 800;
      box-shadow: 0 0 24px rgba(239, 112, 130, 0.2);
      animation: warning-flash 0.8s ease-in-out infinite;
    }

    .warning-title {
      display: block;
      margin-bottom: 18px;
      font-size: clamp(2.2rem, 9vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(239, 112, 130, 0.2);
    }

    .warning-message {
      margin: 0;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    /* Dòng chữ chuyển trang */
    .next-link {
      display: none;
      margin-top: 22px;
      color: #d66b98;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .next-link.visible {
      display: inline-block;
    }

    .next-link:hover {
      color: #a94775;
    }

    @keyframes warning-flash {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.98);
      }
    }

    @media (max-width: 400px) {
      .answer-options {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .warning-response,
      .answer-option {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>

<audio id="bg-music" loop>
  <source src="song2.mp3" type="audio/mpeg">
  Trình duyệt không hỗ trợ phát nhạc.
</audio>

<button onclick="document.getElementById('bg-music').play()">
  ♫ Phát nhạc
</button>

<body>
  <main class="page-shell">
    <section class="lock-card">

      <div class="success-mark">💗</div>

      <p class="eyebrow">BROTHER VERIFICATION · 02</p>

      <h1>Câu hỏi số 2</h1>

      </p>

      <p class="quiz-question">
        Anh có khoẻ hăm (⁠◕⁠ᴗ⁠◕⁠✿⁠)
      </p>

      <!-- Hai ô đáp án -->
      <div class="answer-options">
        <button
          type="button"
          class="answer-option"
          data-answer="yes"
        >
          Có
        </button>

        <button
          type="button"
          class="answer-option"
          data-answer="no"
        >
          Không
        </button>
      </div>

      <!-- Thông báo khi chọn Có -->
      <div
        id="healthy-response"
        class="response-box healthy-response"
        role="status"
        aria-live="polite"
      >
        Ừ rs?
      </div>

      <!-- Thông báo khi chọn Không -->
      <div
        id="warning-response"
        class="response-box warning-response"
        role="alert"
        aria-live="assertive"
      >
        <span class="warning-title">WARNING!!!</span>

        <p class="warning-message">
          Báo với bố mẹ r đi khám đi bsuvdiwnskawkfhxns
        </p>
      </div>

      <!-- Chỉ hiện sau khi chọn Có hoặc Không -->
      <a
        href="quiz3.html"
        id="next-button"
        class="next-link"
      >
        Tiếp theo →
      </a>

    </section>
  </main>

  <script>
    const answerButtons = document.querySelectorAll(".answer-option");
    const healthyResponse = document.querySelector("#healthy-response");
    const warningResponse = document.querySelector("#warning-response");
    const nextButton = document.querySelector("#next-button");

    function showResponse(answer) {
      // Ẩn thông báo cũ
      healthyResponse.classList.remove("visible");
      warningResponse.classList.remove("visible");

      if (answer === "yes") {
        healthyResponse.classList.add("visible");
      } else {
        warningResponse.classList.add("visible");
      }

      // Hiện dòng Tiếp theo sau khi chọn một đáp án
      nextButton.classList.add("visible");
    }

    answerButtons.forEach((button) => {
      button.addEventListener("click", () => {
        showResponse(button.dataset.answer);
      });
    });
  </script>
</body>
</html>
