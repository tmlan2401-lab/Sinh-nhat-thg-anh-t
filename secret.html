
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0911">
  <title>Bí mật đã mở</title>

  <link rel="stylesheet" href="style.css">
  <script src="secret.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="lock-card secret-card"
             aria-labelledby="secret-title">

      <div class="success-mark" aria-hidden="true">✦</div>

      <p class="eyebrow">ACCESS GRANTED</p>

      <h1 id="secret-title">
        Mở khóa thành công!
      </h1>

      <p class="intro">
        Xin chúc mừng, em đã tìm được mật mã.
      </p>

      <div class="secret-message">
        <span class="message-sparkle" aria-hidden="true">✧</span>

        <p>Em gái cute bá khí nhất thế giới</p>

        <span class="message-sparkle" aria-hidden="true">✧</span>
      </div>

      <p class="intro closing-line">
        Danh hiệu này đã được xác nhận bởi hội đồng…
        người viết website.
      </p>

      <a class="button button-primary back-button"
         href="index.html">
        Quay lại trang mật mã
      </a>

    </section>
  </main>
</body>
</html>
